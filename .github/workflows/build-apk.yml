name: Build APK

on:
  push:
    branches:
      - claude/android-popup-app-dday-schedule-efem3j
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: popupschool-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to "latest-debug" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: 최신 디버그 빌드 (자동)
          body: |
            커밋 ${{ github.sha }} 기준으로 자동 빌드된 디버그 APK입니다.
            태블릿/휴대폰에서 이 페이지의 `app-debug.apk`를 다운로드한 뒤 설치하세요.
            (설치 전 "출처를 알 수 없는 앱 설치" 허용이 필요할 수 있습니다.)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
